# Keyring and auth (Unified with KDE Plasma)
exec-once = /usr/libexec/pam_kwallet_init
exec-once = /usr/bin/kwalletd6
exec-once = /usr/libexec/kf6/polkit-kde-authentication-agent-1

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Auto delete trash 30 days old
exec-once = trash-empty 30

# Cursors
exec-once = hyprctl setcursor $cursorTheme $cursorSize
exec-once = gsettings set org.gnome.desktop.interface cursor-theme '$cursorTheme'
exec-once = gsettings set org.gnome.desktop.interface cursor-size $cursorSize

# Location provider and night light
exec-once = /usr/lib/geoclue-2.0/demos/agent
exec-once = sleep 1 && gammastep

# Forward bluetooth media commands to MPRIS
exec-once = mpris-proxy

# Resize and move windows based on matches (e.g. pip)
exec-once = caelestia resizer -d

# Start shell after Hyprland has finished creating its Wayland layers.
# Launch Quickshell directly so the desktop is not left at the bare compositor
# background if the Caelestia wrapper races session startup.
exec-once = sleep 2; qs -c caelestia -n -d
