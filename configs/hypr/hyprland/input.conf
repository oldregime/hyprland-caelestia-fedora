input {
    kb_layout = us
    numlock_by_default = false
    repeat_delay = 250
    repeat_rate = 35

    follow_mouse = 1
    focus_on_close = 1
    sensitivity = 0

    touchpad {
        tap-to-click = true
        tap_button_map = lrm
        natural_scroll = true
        disable_while_typing = $touchpadDisableTyping
        scroll_factor = $touchpadScrollFactor
        drag_lock = false
    }
}

binds {
    scroll_event_delay = 0
}

cursor {
    no_hardware_cursors = true
    hotspot_padding = 1
}

